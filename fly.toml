app = "termeow-agent"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_PRIVY_APP_ID = "cmtt8120900n10cjl5np0w4t4"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "9300"
  APP_ORIGIN = "https://termeow-agent.fly.dev"
  SNAPSHOT_DIR = "/tmp/termeow/snapshots"
  TERMINAL_DATA_DIR = "/app/data/terminal"

[deploy]
  release_command = "npm run db:migrate"

[http_service]
  internal_port = 9300
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
